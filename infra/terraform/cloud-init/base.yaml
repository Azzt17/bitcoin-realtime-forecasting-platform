#cloud-config
package_update: true
package_upgrade: false

packages:
  - curl
  - wget
  - git
  - htop
  - unzip
  - jq
  - ca-certificates
  - gnupg
  - lsb-release
  - python3
  - python3-pip
  - openjdk-17-jre-headless

write_files:
  - path: /etc/bitcoin-platform-node
    permissions: "0644"
    content: |
      NODE_NAME=${node_name}
      NODE_ROLE=${node_role}

runcmd:
  - mkdir -p /opt/bitcoin-realtime-forecasting-platform
  - echo "${node_name} (${node_role}) provisioned at $(date -u)" > /opt/bitcoin-realtime-forecasting-platform/provisioned.txt
